name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm type-check
      - run: pnpm test:unit
      - run: pnpm build
      - run: pnpm check:site

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build the indexer image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: archetypes-indexer:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build the site inside the image
        # --build exports the (empty) store, runs astro build in the image and skips the
        # deploy because no Bunny credentials are set. This catches packaging regressions.
        run: docker run --rm archetypes-indexer:ci node src/main.ts --build
